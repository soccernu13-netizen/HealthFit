      --line: rgba(255,255,255,0.08);

      --accent-ink: #1a160e;

      --warn: #d7b56d;

    }

      color: var(--ok);
      border-radius: 999px;
      padding: 6px 10px;
      font-size: 12px;
      font-weight: 650;
      white-space: nowrap;

    .row { margin-top: 12px; }
    .grow { flex: 1; min-width: 140px; }
    button, .btn {
      background: var(--accent);
      color: var(--accent-ink);
      border: 0;
      border-radius: 8px;
      min-height: 42px;
      padding: 0 14px;
      font-size: 13px;
      font-weight: 650;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;

      min-height: 42px;
      border-radius: 8px;
      border: 1px solid var(--line);
      background: var(--bg);
      color: var(--text);
      padding: 0 12px;
      font-size: 15px;

      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;

      align-items: center;
      gap: 12px;

      padding: 8px;

      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

      inset: 0;
      background: rgba(8, 10, 12, 0.42);

      align-items: center;
      justify-content: center;

      object-fit: cover;
      border-radius: 10px;
      margin: 0 0 12px;
      background: #000;

      width: 100vw;
      height: 100vh;
      min-height: 100vh;
      border-radius: 0;
      margin: 0;
      background: #000;

      overflow: auto;
      background: var(--panel);
      border: 1px solid var(--line);
      padding: 22px;

    .stack .btn, .stack button, .stack .btn-sec { width: 100%; }
    .head { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; }
    button:focus-visible, .btn:focus-visible, input:focus-visible, textarea:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;

    function timerView(workout) {
      const steps = flattenCircuit(workout);
      if (!ui.timer || ui.timer.id !== workout.id) ui.timer = { id: workout.id, index: 0, left: steps[0]?.seconds || 0, running: false, handle: null };
      const step = steps[ui.timer.index];
      if (!step) return "";
      const done = ui.timer.index === steps.length - 1 && ui.timer.left === 0 && !ui.timer.running;
      const total = steps.reduce((sum, item) => sum + item.seconds, 0) || 1;
      const elapsed = steps.slice(0, ui.timer.index).reduce((sum, item) => sum + item.seconds, 0) + (step.seconds - ui.timer.left);
      return `<div class="card timer" id="timer-card">
        <div class="phase" id="timer-phase">${done ? "Finished" : step.rest ? "Rest" : "Round " + step.round}</div>
        <div class="clock" id="timer-clock">${pad(Math.floor(ui.timer.left / 60))}:${pad(ui.timer.left % 60)}</div>
        <h2 id="timer-name">${done ? "Session complete" : esc(step.name)}</h2>
        <div class="progress"><div id="timer-bar" style="width:${Math.min(100, (elapsed / total) * 100)}%"></div></div>
        <p class="muted" id="timer-meta">${ui.timer.index + 1} / ${steps.length} · ${workout.minutes} min</p>
        <div class="actions">
          <button data-act="timer-toggle" data-id="${workout.id}">${ui.timer.running ? "Pause" : "Start timer"}</button>
          <button class="btn-sec" data-act="timer-skip" data-id="${workout.id}">Skip</button>
        </div>
      </div>`;
    }
    function paintTimer(workout) {
      const card = document.getElementById("timer-card");
      if (!card) return;
      card.outerHTML = timerView(workout);
    }
    function runTimer(workout) {
      const steps = flattenCircuit(workout);
      if (ui.timer.handle) clearInterval(ui.timer.handle);
      ui.timer.running = true;
      ui.timer.handle = setInterval(() => {
        if (ui.timer.left > 1) {
          ui.timer.left -= 1;
          paintTimer(workout);
          return;
        }
        if (ui.timer.index >= steps.length - 1) {
          ui.timer.running = false;
          ui.timer.left = 0;
          clearInterval(ui.timer.handle);
          ui.timer.handle = null;
          paintTimer(workout);
          return;
        }
        ui.timer.index += 1;
        ui.timer.left = steps[ui.timer.index].seconds;
        paintTimer(workout);
      }, 1000);
      paintTimer(workout);
    }

            <div class="field"><input id="quick-food-name" placeholder="Yogurt, coffee, lunch…" /></div>
            <div class="row">

              <button data-act="save-food">Add</button>
            </div>

    function planPage() {

    function weightPage() {

      const thisWeek = weeks.find((week) => week.isThisWeek);
      const inWeek = thisWeek ? changeInfo(thisWeek.inWeek, state.unit) : null;

      return `<div class="head">
          <div><div class="kicker">Scale</div><h1>Weight log</h1></div>
          ${chips([["lb","lb"],["kg","kg"]], state.unit, "unit")}
        </div>
        <div class="stats stats-2">
          <div class="stat"><span>Now</span><b>${latest ? `${displayWeight(latest.pounds, state.unit).toFixed(1)} ${state.unit}` : "—"}</b></div>
          <div class="stat"><span>This week</span><b class="${inWeek?.cls || ""}">${inWeek ? inWeek.text : "—"}</b></div>
          <div class="stat"><span>Vs last week</span><b class="${vsLast?.cls || ""}">${vsLast ? vsLast.text : "—"}</b></div>
          <div class="stat"><span>Entries</span><b>${state.weights.length}</b></div>
        </div>
        <div class="card">
          <label>Weight (${state.unit})</label>
          <input id="w-value" inputmode="decimal" />
          <div class="field"><label>Note</label><input id="w-note" placeholder="Morning, after workout…" /></div>
          <div class="actions"><button data-act="save-weight">Save weight</button></div>
          ${vsLast || inWeek ? `<p class="hint">${vsLast ? `After this log, vs last week: ${esc(vsLast.text)}. ` : ""}Inside this week: ${esc(inWeek ? inWeek.text : "needs a second weigh-in")}.</p>` : `<p class="hint">Save a weigh-in this week and last week to see weight lost per week.</p>`}
        </div>
        <p class="hint">Weigh-ins stay on this ${storagePlace()}. They are not uploaded.</p>
        <div class="card">
          <h3>By week</h3>
          <p class="muted">Monday–Sunday. “Vs last week” compares this week’s latest weigh-in to last week’s latest.</p>
          ${weeks.length ? weeks.map((week) => {
            const headline = week.vsPrevWeek != null ? changeInfo(week.vsPrevWeek, state.unit) : changeInfo(week.inWeek, state.unit);
            const inside = changeInfo(week.inWeek, state.unit);
            return `<div class="week-block">
              <div class="week-head">
                <h3>${week.isThisWeek ? "This week" : `${formatShort(week.start)} – ${formatShort(week.end)}`}</h3>

              </div>
              <p class="hint">${week.vsPrevWeek != null ? `Vs last week: ${esc(changeInfo(week.vsPrevWeek, state.unit).text)} · ` : ""}In week: ${esc(inside.text)} · ${week.entries.length} weigh-in${week.entries.length === 1 ? "" : "s"}</p>

                const prior = previousWeighIn(entry.date);

              }).join("")}
            </div>`;
          }).join("") : `<p class="empty">No weigh-ins yet.</p>`}
        </div>`;

      const total = caloriesOn(today);
      const goal = Number(state.calorieGoal) || 0;
      const left = goal ? goal - total : null;
      const days = foodDayGroups();
      return `<div class="kicker">Eat</div><h1>Food log</h1>
        <div class="stats stats-2">
          <div class="stat"><span>Today</span><b>${total} cal</b></div>
          <div class="stat"><span>${goal ? (left >= 0 ? "Left" : "Over") : "Items"}</span><b>${goal ? Math.abs(left) : todayFoods.length}</b></div>
        </div>
        <div class="card">
          <h3>Add food</h3>
          <p class="muted">Type the food and calories from the package or your best guess.</p>
          <div class="field"><label>Food</label><input id="food-name" placeholder="Chicken, apple, latte…" /></div>
          <div class="field"><label>Calories</label><input id="food-cal" inputmode="numeric" placeholder="250" /></div>

        <p class="hint">Food stays on this ${storagePlace()}. Not medical advice.</p>`;

    function logPage() {
      const place = storagePlace();
      return `<div class="kicker">Progress</div><h1>Workout log</h1>
        <div class="card">
          <h3>Stays on this ${place}</h3>
          <p class="muted">Your name, weight, food, plan, and workout history are saved only in this browser on this ${place}. ${APP_NAME} does not upload them to GitHub or copy them to another phone.</p>
          <p class="hint">On iPhone, use Share → Add to Home Screen so Safari is less likely to erase the log. You can also keep a backup file on this phone.</p>
          <div class="actions">
            <button class="btn-sec" data-act="backup-save">Save backup on this phone</button>
            <button class="btn-ghost" data-act="backup-pick">Restore backup</button>
          </div>
          <input id="restore-file" class="file-hidden" type="file" accept="application/json,.json" />
        </div>

          <label>Name</label>

          <div class="field"><label>Equipment</label>${chips(GEAR_OPTIONS, state.gear, "gear")}</div>
          <p class="hint">${FOR_HER ? "Light dumbbells are about 3–12 lb." : "Light dumbbells are about 10–25 lb."} Changing equipment resets the weekly plan, not your history.</p>
        </div>

    function playerHtml(workout) {
      const extra = workout.finisherId ? findWorkout(workout.finisherId) : null;
      const search = workout.searchQuery || `${workout.creatorLabel} ${workout.title}`;
      const yt = workout.youtubeId ? youtubeWatchUrl(workout.youtubeId) : youtubeSearchUrl(search);
      return `<div class="overlay"><div class="overlay-inner">
        <div class="session-bar">
          <button type="button" data-act="close-player">Close</button>
          <button type="button" class="btn-sec" data-act="assign" data-id="${workout.id}">Put on a day</button>
        </div>
        <div class="kicker">${esc(workout.creatorLabel)} · ${workout.minutes} min · ${esc(workout.equipment)}</div>
        <h1>${esc(workout.title)}</h1>
        <p class="muted">${esc(workout.summary)}</p>
        ${workout.youtubeId ? videoStage(workout.youtubeId) : `<p class="muted">This session is a timed circuit. There is no video in-app. Open YouTube if you want a follow-along.</p>`}
        <div class="actions">
          ${workout.youtubeId ? `<a class="btn" href="${youtubeWatchUrl(workout.youtubeId)}" target="_blank" rel="noopener">Play video</a>` : ""}
          <a class="btn btn-sec" href="${yt}" target="_blank" rel="noopener">${workout.youtubeId ? "Open in YouTube" : "Find a video on YouTube"}</a>
          <button class="btn-ghost" data-act="swap" data-id="${workout.id}">Find a similar video</button>

        ${extra ? `<div class="card"><h3>Make it 15 minutes</h3><p class="muted">${esc(extra.title)}. Run this after the video.</p></div>${timerView(extra)}` : ""}
        <div class="card">
          <h3>Mark complete</h3>
          <p class="muted">How hard was it?</p>
          <div class="effort">${[1,2,3,4,5].map((n) => `<button data-act="effort" data-n="${n}" class="${ui.effort === n ? "on" : ""}">${n}</button>`).join("")}</div>
          <textarea id="notes" placeholder="${FOR_HER ? "Felt good, walked the last minute…" : "Knee push-ups, felt good…"}">${esc(ui.notes)}</textarea>
          <div class="actions"><button data-act="complete">Save workout</button></div>
        </div>

    function sheetHtml() {
      if (!ui.sheet) return "";
      if (ui.sheet.type === "assign") {
        const workout = ui.sheet.workout;
        return `<div class="sheet-bg" data-act="close-sheet"></div>
          <div class="sheet">
            <h2>Add to a day</h2>
            <p class="muted">${esc(workout.title)}</p>
            <div class="stack">${sortedPlan().map((day) => `<button class="btn-sec" data-act="pick-day" data-day="${day.weekday}">${day.label} · ${esc(day.focus)}</button>`).join("")}
            <button class="btn-ghost" data-act="close-sheet">Cancel</button></div>
          </div>`;
      }
      const workout = ui.sheet.workout;
      const similar = similarLibrary(workout, allWorkouts());
      return `<div class="sheet-bg" data-act="close-sheet"></div>
        <div class="sheet">
          <h2>Find a similar video</h2>
          <p class="muted">Replace ${esc(workout.title)} with another ${workout.minutes}-minute ${usesDumbbells(workout) ? "dumbbell" : "bodyweight"} session.</p>
          <div class="stack">
            <a class="btn" href="${youtubeSearchUrl(similarSearchQuery(workout))}" target="_blank" rel="noopener">Search YouTube for one like this</a>
          </div>
          <div class="field"><label>Paste the YouTube link</label><input id="swap-url" placeholder="https://youtube.com/watch?v=…" /></div>
          <div class="actions"><button data-act="swap-paste">Use this video</button></div>
          ${similar.length ? `<h3 style="margin-top:18px">Already in ${APP_NAME}</h3><div class="stack">${similar.map((w) => `<button class="btn-sec" data-act="swap-pick" data-id="${w.id}">${esc(w.title)} · ${w.minutes} min</button>`).join("")}</div>` : ""}
          <div class="actions"><button class="btn-ghost" data-act="close-sheet">Keep this one</button></div>
        </div>`;

    function readInputs() {
      const notes = document.getElementById("notes");
      if (notes) ui.notes = notes.value;
      const q = document.getElementById("search-q");
      if (q) ui.query = q.value;
    }

    function render() {
      persist();
      const pages = { today: todayPage, plan: planPage, search: searchPage, food: foodPage, weight: weightPage, more: logPage };
      root.innerHTML = `${header()}<div class="page">${(pages[ui.tab] || todayPage)()}</div>${ui.active ? playerHtml(ui.active) : ""}${sheetHtml()}`;
    }

    function saveWeight(raw, note) {
      const n = Number(raw);
      if (!Number.isFinite(n) || n <= 0) return;
      const pounds = state.unit === "lb" ? n : kgToLb(n);
      const date = todayKey();
      state.weights = [{ id: uid(), date, pounds, note: (note || "").trim(), savedAt: Date.now() }, ...state.weights.filter((w) => w.date !== date)].sort((a, b) => b.date.localeCompare(a.date));
      ui.tab = "weight";
      render();
    }

    function saveFood() {
      const name = (document.getElementById("food-name") || document.getElementById("quick-food-name"))?.value.trim();
      const cal = Number((document.getElementById("food-cal") || document.getElementById("quick-food-cal"))?.value);
      if (!name || !Number.isFinite(cal) || cal < 0) return;
      state.foods = [{ id: uid(), date: todayKey(), name, calories: Math.round(cal), savedAt: Date.now() }, ...state.foods];
      render();
    }

    root.addEventListener("click", (event) => {
      const el = event.target.closest("[data-act]");
      if (!el) return;
      const act = el.dataset.act;
      const id = el.dataset.id;
      readInputs();
      if (act === "tab") { stopTimer(); ui.active = null; ui.tab = id; render(); return; }
      if (act === "open" && id) { ui.effort = 3; ui.notes = ""; ui.active = findWorkout(id); render(); return; }
      if (act === "close-player") {
        stopTimer();
        ui.active = null;
        ui.sheet = null;
        render();
        return;
      }
      if (act === "play-youtube") {
        const watch = youtubeWatchUrl(id || ui.active?.youtubeId);
        if (watch) window.open(watch, "_blank", "noopener");
        return;
      }
      if (act === "fullscreen") {
        const stage = document.getElementById("video-stage");
        if (location.protocol === "file:" || !stage) {
          const watch = youtubeWatchUrl(id || ui.active?.youtubeId);
          if (watch) window.open(watch, "_blank", "noopener");
          return;
        }
        if (document.fullscreenElement || document.webkitFullscreenElement) {
          (document.exitFullscreen || document.webkitExitFullscreen).call(document);
        } else if (stage.requestFullscreen) {
          stage.requestFullscreen();
        } else if (stage.webkitRequestFullscreen) {
          stage.webkitRequestFullscreen();
        }
        return;
      }
      if (act === "assign") { ui.sheet = { type: "assign", workout: findWorkout(id) }; render(); return; }
      if (act === "close-sheet") { ui.sheet = null; render(); return; }
      if (act === "swap") {
        const w = findWorkout(id);
        ui.sheet = { type: "swap", workout: w, weekday: el.dataset.day !== undefined ? Number(el.dataset.day) : weekdayFor(w.id) };
        render();
        return;
      }
      if (act === "unit") { state.unit = id; render(); return; }
      if (act === "gear") {
        if (id === state.gear) return;
        if (!confirm("Load a matching weekly plan? Your workout log and weight history stay.")) return;
        state.gear = id;
        state.plan = planForGear(id);
        render();
        return;
      }
      if (act === "gear-filter") { ui.gearFilter = id; render(); return; }
      if (act === "creator") { ui.creator = id; render(); return; }
      if (act === "focus") { ui.focus = id; render(); return; }
      if (act === "reset-plan") { state.plan = planForGear(state.gear); render(); return; }
      if (act === "save-name") { state.name = (document.getElementById("name-input")?.value || "").trim(); render(); return; }
      if (act === "backup-save") { exportBackup(); return; }
      if (act === "backup-pick") { document.getElementById("restore-file")?.click(); return; }
      if (act === "save-quick") { saveWeight(document.getElementById("quick-weight")?.value); return; }
      if (act === "save-weight") { saveWeight(document.getElementById("w-value")?.value, document.getElementById("w-note")?.value); return; }
      if (act === "save-food") { saveFood(); return; }
      if (act === "save-cal-goal") {
        const n = Number(document.getElementById("cal-goal")?.value);
        state.calorieGoal = Number.isFinite(n) && n > 0 ? Math.round(n) : 0;
        render();
        return;
      }
      if (act === "delete-food") {
        state.foods = (state.foods || []).filter((entry) => entry.id !== id);
        render();
        return;
      }
      if (act === "save-yt") {
        const youtubeId = parseYoutubeId(document.getElementById("save-url")?.value);
        if (!youtubeId) { alert("Paste a full YouTube URL first."); return; }
        const w = customVideo({ minutes: 15, focus: "full-body", equipment: "Home", gear: state.gear === "dumbbells" ? "dumbbells" : "bodyweight" }, youtubeId, (document.getElementById("save-title")?.value || "").trim());
        state.customWorkouts = [w, ...state.customWorkouts.filter((x) => x.id !== w.id)];
        ui.sheet = { type: "assign", workout: w };
        render();
        return;
      }
      if (act === "pick-day") {
        placeOnDay(Number(el.dataset.day), ui.sheet.workout);
        ui.sheet = null;
        ui.tab = "plan";
        render();
        return;
      }
      if (act === "swap-paste") {
        const youtubeId = parseYoutubeId(document.getElementById("swap-url")?.value);
        if (!youtubeId) { alert("Paste a full YouTube URL first."); return; }
        const w = customVideo(ui.sheet.workout, youtubeId);
        placeOnDay(ui.sheet.weekday, w);
        ui.active = w;
        ui.sheet = null;
        render();
        return;
      }
      if (act === "swap-pick") {
        const w = findWorkout(id);
        placeOnDay(ui.sheet.weekday, w);
        ui.active = w;
        ui.sheet = null;
        render();
        return;
      }
      if (act === "effort") {
        ui.effort = Number(el.dataset.n);
        root.querySelectorAll("[data-act=effort]").forEach((btn) => btn.classList.toggle("on", Number(btn.dataset.n) === ui.effort));
        return;
      }
      if (act === "complete" && ui.active) {
        const extra = ui.active.finisherId ? findWorkout(ui.active.finisherId) : null;
        state.sessions = [{ id: uid(), date: todayKey(), workoutId: ui.active.id, title: ui.active.title, minutes: ui.active.minutes + (extra?.minutes || 0), effort: ui.effort, notes: ui.notes.trim() }, ...state.sessions];
        stopTimer();
        ui.active = null;
        ui.tab = "more";
        render();
        return;
      }
      if (act === "timer-toggle") {
        const workout = findWorkout(id);
        const steps = flattenCircuit(workout);
        if (!ui.timer || ui.timer.id !== workout.id) ui.timer = { id: workout.id, index: 0, left: steps[0].seconds, running: false, handle: null };
        if (ui.timer.running) {
          clearInterval(ui.timer.handle);
          ui.timer.handle = null;
          ui.timer.running = false;
          paintTimer(workout);
        } else {
          runTimer(workout);
        }
        return;
      }
      if (act === "timer-skip") {
        const workout = findWorkout(id);
        const steps = flattenCircuit(workout);
        if (!ui.timer || ui.timer.id !== workout.id) ui.timer = { id: workout.id, index: 0, left: steps[0].seconds, running: false, handle: null };
        ui.timer.index = Math.min(steps.length - 1, ui.timer.index + 1);
        ui.timer.left = steps[ui.timer.index].seconds;
        paintTimer(workout);
      }
    });

    root.addEventListener("change", (event) => {
      if (event.target.id !== "restore-file") return;
      const file = event.target.files?.[0];
      event.target.value = "";
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        try {
          const parsed = JSON.parse(String(reader.result || ""));
          const incoming = parsed.state || parsed;
          if (!incoming || typeof incoming !== "object") throw new Error("bad backup");
          if (!confirm("Add this backup to this phone? Existing workouts and weigh-ins are kept. A same-day weigh-in in the file replaces that day.")) return;
          mergeIncoming(incoming);
          persist();
          ui.tab = "weight";
          render();
        } catch (_) {
          alert("Could not read that backup file.");
        }
      };
      reader.readAsText(file);
    });

    root.addEventListener("keydown", (event) => {
      if (event.key !== "Enter") return;
      if (event.target.id === "quick-weight") { event.preventDefault(); saveWeight(event.target.value); }
      if (event.target.id === "w-value" || event.target.id === "w-note") { event.preventDefault(); saveWeight(document.getElementById("w-value")?.value, document.getElementById("w-note")?.value); }
      if (event.target.id === "food-name" || event.target.id === "food-cal" || event.target.id === "quick-food-name" || event.target.id === "quick-food-cal") { event.preventDefault(); saveFood(); }
      if (event.target.id === "search-q") { event.preventDefault(); ui.query = event.target.value; render(); }
    });

    render();
    hydrateFromDevice();
    if (location.protocol === "https:") {
      navigator.storage?.persist?.();
      navigator.serviceWorker?.register("./sw.js").catch(() => {});
    }
  </script>
</body>
</html>
